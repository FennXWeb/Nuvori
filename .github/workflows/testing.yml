name: Private testing build
on:
  push:
    branches: [codex/testing]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-testing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'FennXWeb/Nuvori-Testing' && github.ref == 'refs/heads/codex/testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nuvori-private-web-build
          path: dist
          retention-days: 14
